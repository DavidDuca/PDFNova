[build]
  publish = "dist"

# --- Static files: pass through explicitly (order matters — more specific first) ---
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

# --- SPA catch-all (only for non-file, non-api paths) ---
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- Security headers ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"